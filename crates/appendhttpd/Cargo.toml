[package]
name = "appendhttpd"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
repository.workspace = true

[dependencies]
append-kv = { version = "0.1.0", path = "../append-kv" }
argh = { version = "0.1.19", default-features = false, features = ["help"] }
base64ct = "1.8.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
pin-project-lite = "0.2.18"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }

[lints]
workspace = true
